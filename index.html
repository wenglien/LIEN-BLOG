
  <!DOCTYPE html>
<html lang="zh-TW">
    <head>
      <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="LIEN Photography 攝影作品集，展示創意視角、風景、街拍與人像作品，記錄台灣景色與生活瞬間。" />
    <meta name="keywords" content="攝影,攝影作品集,風景攝影,人像攝影,街拍,創意攝影,台灣攝影,LIEN Photography" />
    <meta name="author" content="LIEN Photography" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#000000" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lien-gallery.web.app/" />
    <meta property="og:title" content="LIEN Photography" />
    <meta property="og:description" content="探索創意視角、風景、街拍、人像等多元攝影風格，記錄台灣美景與生活瞬間。" />
    <meta property="og:image" content="https://lien-gallery.web.app/logo.png" />
    <meta property="og:locale" content="zh_TW" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://lien-gallery.web.app/" />
    <meta property="twitter:title" content="LIEN Photography" />
    <meta property="twitter:description" content="探索創意視角、風景、街拍、人像等多元攝影風格，記錄台灣美景與生活瞬間。" />
    <meta property="twitter:image" content="https://lien-gallery.web.app/logo.png" />
    <link rel="canonical" href="https://lien-gallery.web.app/" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <!-- Only preload the small asset needed by the opening screen. -->
    <link rel="preload" href="/logo.png" as="image" fetchpriority="high" />

    <!-- Artistic fonts for opening animation - with display=swap for faster rendering -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap" rel="stylesheet" />

    <!-- Critical CSS inline for faster first paint -->
    <style>
      /* Critical styles for initial render */
      body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
      }
      /* Prevent FOUC */
      html {
        background: #000;
      }
    </style>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Photographer",
      "name": "LIEN Photography",
      "description": "展示創意視角、風景、街拍、人像等多元攝影風格",
      "url": "https://lien-gallery.web.app/",
      "image": "https://lien-gallery.web.app/logo.png",
      "sameAs": []
    }
    </script>

    <title>LIEN Photography</title>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    <noscript>

        <p>此網站需要 JavaScript 才能正常運作。請啟用瀏覽器的 JavaScript 功能。</p>
      </div>
    </noscript>
    </body>
  </html>
